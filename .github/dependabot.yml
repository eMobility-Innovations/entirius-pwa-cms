version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are a developer upgrade (org decision), never a bot PR: vue-router, pinia, marked, Font Awesome and the
      # vue-cli 5 / webpack 5 toolchain move in a branch of their own.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
